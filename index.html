<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8512b">
<title>Menyu · QR menu builder</title>
<meta name="description" content="White-label QR menu builder for cafes and restaurants. Arabic and English. Free, no server.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-tab="menu">
<header class="top">
  <div class="brand"><img src="assets/logo.svg" alt="" width="34" height="34"><b id="title-text">Menyu</b></div>
  <div class="top-acts">
    <button type="button" id="undo" class="btn ghost small" disabled>↶ Undo</button>
    <button type="button" id="lang-btn" class="btn ghost small">العربية</button>
  </div>
</header>
<div class="shell">
  <main id="main" class="work" tabindex="-1"></main>
  <aside class="pv" aria-labelledby="pv-title">
    <h2 id="pv-title" class="pv-t">Live preview</h2>
    <div class="phone"><iframe id="pv-frame" title="Menu preview" loading="eager"></iframe></div>
  </aside>
</div>
<nav class="tabs" role="tablist">
  <button role="tab" class="tab" data-tab="menu"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></i><span>Menu</span></button>
  <button role="tab" class="tab" data-tab="brand"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2-.6-1.2.2-2.5 1.6-2.5H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg></i><span>Brand</span></button>
  <button role="tab" class="tab" data-tab="share"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v0M17 20h4M20 17v0"/></svg></i><span>Share</span></button>
  <button role="tab" class="tab tab-pv" data-tab="preview"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></i><span>Preview</span></button>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="print-area" aria-hidden="true"></div>
<noscript>JavaScript is required.</noscript>
<script src="js/core.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/export.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
