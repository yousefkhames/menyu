<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8512b">
<title>Menyu · QR menu builder</title>
<meta name="description" content="White-label QR menu builder for cafes and restaurants. Arabic and English. Free, no server.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-tab="menu">
<header class="top">
  <div class="brand"><img src="assets/logo.svg" alt="" width="34" height="34"><b id="title-text">Menyu</b></div>
  <div class="top-acts">
    <button type="button" id="undo" class="btn ghost small" disabled>↶ Undo</button>
    <button type="button" id="lang-btn" class="btn ghost small">العربية</button>
  </div>
</header>
<div class="shell">
  <main id="main" class="work" tabindex="-1"></main>
  <aside class="pv" aria-labelledby="pv-title">
    <h2 id="pv-title" class="pv-t">Live preview</h2>
    <div class="phone"><iframe id="pv-frame" title="Menu preview" loading="eager"></iframe></div>
  </aside>
</div>
<nav class="tabs" role="tablist">
  <button role="tab" class="tab" data-tab="menu"><i aria-hidden="true">☰</i><span>Menu</span></button>
  <button role="tab" class="tab" data-tab="brand"><i aria-hidden="true">🎨</i><span>Brand</span></button>
  <button role="tab" class="tab" data-tab="share"><i aria-hidden="true">▦</i><span>Share</span></button>
  <button role="tab" class="tab tab-pv" data-tab="preview"><i aria-hidden="true">👁</i><span>Preview</span></button>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="print-area" aria-hidden="true"></div>
<noscript>JavaScript is required.</noscript>
<script src="js/core.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/export.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
